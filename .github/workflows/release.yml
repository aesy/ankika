name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev ;;
            macOS) brew install protobuf ;;
            Windows) choco install protoc -y ;;
          esac

      - name: Build
        run: cargo build --locked --release -p ankika --target ${{ matrix.target }}

      - name: Package
        run: |
          name="ankika-$GITHUB_REF_NAME-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/ankika"
          [ "$RUNNER_OS" = Windows ] && bin="$bin.exe"
          generate=("$bin" --log-file "$RUNNER_TEMP/generate.log")

          mkdir -p "$name/completions"
          cp "$bin" LICENSE README.md "$name/"
          "${generate[@]}" completions bash > "$name/completions/ankika.bash"
          "${generate[@]}" completions zsh > "$name/completions/_ankika"
          "${generate[@]}" completions fish > "$name/completions/ankika.fish"
          "${generate[@]}" completions powershell > "$name/completions/_ankika.ps1"
          "${generate[@]}" man > "$name/ankika.1"

          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            ankika-*.tar.gz
            ankika-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum ankika-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes ankika-* SHA256SUMS
