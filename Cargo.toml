[workspace]
resolver = "3"
members = [
    "app/ankika",
    "app/ankika-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
authors = ["Isak Wertwein <isak.wertwein@gmail.com>"]
license = "AGPL-3.0-or-later"
homepage = "https://aesy.github.io/ankika/"
repository = "https://github.com/aesy/ankika"
readme = "README.md"
keywords = ["anki", "ankiweb", "flashcards", "srs", "tui"]
categories = ["command-line-utilities"]
# The `anki` git dependency can't be published to crates.io
publish = false

[workspace.dependencies]
ankika-core = { path = "app/ankika-core" }

anki = { git = "https://github.com/ankitects/anki.git", tag = "26.09.4" }
anki_proto = { git = "https://github.com/ankitects/anki.git", tag = "26.09.4" }
clap = "4.6.9"
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
crossterm = "0.29.0"
directories = "6.0.0"
fluent-bundle = "0.16.0"
futures-util = "0.3.34"
html2text = { version = "0.17.4", features = ["css"] }
# Decoders only; the default `rayon` feature isn't needed for one card's images
image = { version = "0.25.10", default-features = false, features = ["default-formats"] }
keyring = "4.2.0"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
# Without `chafa-dyn`, so no system library is loaded
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
# Must match the version `anki` uses, since `sync_login` takes its `reqwest::Client`
# Playback and decoders only, without recording or dither; `tracing` keeps its messages
# off the terminal
rodio = { version = "0.23.0", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav", "tracing"] }
reqwest = { version = "0.12.28", default-features = false }
rpassword = "7.5.5"
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1.54.1"
toml = "1.2.2"
toml_edit = "0.25.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unic-langid = "0.9.6"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
# Duplicates come from Anki's dependency tree, outside our control
multiple_crate_versions = "allow"

[profile.release]
lto = "fat"
strip = true
panic = "abort"
codegen-units = 1
