[workspace]
resolver = "3"
members = [
    "ankika",
    "ankika-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["Isak Wertwein <isak.wertwein@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/aesy/ankika"
readme = "README.md"
keywords = ["anki", "ankiweb", "flashcards", "srs", "tui"]
categories = ["command-line-utilities"]
# The `anki` git dependency can't be published to crates.io
publish = false

[workspace.dependencies]
ankika-core = { path = "ankika-core" }

anki = { git = "https://github.com/ankitects/anki.git", tag = "26.09.3" }
anki_proto = { git = "https://github.com/ankitects/anki.git", tag = "26.09.3" }
clap = "4.6.7"
crossterm = "0.29.0"
directories = "6.0.0"
fluent-bundle = "0.16.0"
futures-util = "0.3.34"
html2text = { version = "0.17.4", features = ["css"] }
keyring = "4.2.0"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
# Must match the version `anki` uses, since `sync_login` takes its `reqwest::Client`
reqwest = { version = "0.12.28", default-features = false }
rpassword = "7.5.4"
serde = "1.0.229"
thiserror = "2.0.21"
tokio = "1.54.1"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unic-langid = "0.9.6"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
# Duplicates come from Anki's dependency tree, outside our control
multiple_crate_versions = "allow"

[profile.release]
lto = "fat"
strip = true
panic = "abort"
codegen-units = 1
